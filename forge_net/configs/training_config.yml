# Train with the full mesh and "full" action space (steps, pos_x, rot_x)
databases: #database names to process - expected in data/databases folder
  db1: "noisy_cogging.db" 
  db2: "random_hits.db"
  lines: 20_000 #number of lines in database to read

datasets:
  points_per_state: 2048 #Default to the mesh vertices - don't sample (equiv to None in Python)
  mask_points: False #if uses masking to "focus" point cloud \near boundary condtion (plastic deformation domain)
  seed: ~
  data_out: "2048_unseeded_unmasked_data100k_tri_ids.npz" #name of output data (saved in data/datasets folder)

network:
  model_type: "forgenet"
  batch_size: 512
  latent_size: 512
  action_features: ["steps"] #steps only 
  action_dims: 1 #steps: 1, positions: 1 (x-only), rotations: 1 (about x axis)
  gradient_clip: 1.0
  use_res: False
  loss: "mse" #"mse" or "chamfer" or "wsd" (wasserstein-distance)
  optimizer:
    base_learning_rate: 1.0e-4
    min_learning_rate: 1.0e-7
    weight_decay: 1.0e-2
  scheduler:
    start_factor: 1.0
    end_factor: 0.05
    lr_decay_rate: 1.0e-3
    lr_decay_step: 1.0
  dropout: 0.1
  use_gpu: True

run:
  run_name: "test"
  save_every: 50
  run_folder: ???
  # early stopping
  early_stop: False
  patience: 50
  min_delta: 1.0e-6
  num_epochs: 2200

eval:
  eval_idxs: [1, 25, 115]


