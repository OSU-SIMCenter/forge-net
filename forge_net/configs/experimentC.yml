databases:
  db1: "/local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/data/databases/noisy_cogging.db"
  db2: "/local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/data/databases/random_hits.db"
  lines: 1_000_000 #number of lines in database to read

datasets:
  points_per_state: ~
  mask_points: True #if uses masking to "focus" point cloud \near boundary condtion (plastic deformation domain)
  data_out: "/local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/data/datasets/masked_vertices.npz" #user provided path where to save the data

network:
  model_type: "resnetpointae"
  batch_size: 512
  latent_size: 512
  action_features: ["steps"]
  action_dims: 1 #steps: 1, positions: 1 (x-only), rotations: 1 (about z axis)
  gradient_clip: 1.0
  optimizer:
    base_learning_rate: 5.0e-4
    min_learning_rate: 1.0e-6
    weight_decay: 1.0e-4
  scheduler:
    start_factor: 1.0
    end_factor: 0.05
    lr_decay_rate: 1.0e-3
    lr_decay_step: 1.0
  dropout: 0.1
  use_gpu: true

run:
  run_name: "resnetpointae_masked_act1d"
  save_every: 50
  run_folder: ???
  # early stopping
  early_stop: False
  patience: 100
  min_delta: 1.0e-6
  num_epochs: 250

eval:
  eval_idxs: [1, 25, 115]


