databases:
  db_path: /local/scratch/groves/forge_common/data/forge_common_thermal.db
  sequence_types:
  - cogging
  source_sims:
  - cw_slab_model
datasets:
  data_out: /local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/data/datasets/cw_slab_model_cogging_thermal.npz
  seed: 0
  total_points: 2048
eval:
  eval_idxs:
  - 0
  - 100
  - 300
  - 500
  - 700
network:
  action_dims: 3
  action_features:
  - rho
  - phi
  - z
  arch: small
  batch_size: 32
  dropout: 0.1
  gradient_clip: 1.0
  latent_size: 128
  loss: mse
  model_type: forgenet
  # Temperature: separate head (model.py), separate MSE loss term
  # normalized by data-driven pos_delta_std/temp_delta_std (computed fresh
  # each run by make_dataloaders/train_forge_common.py -- not hand-set
  # here) and combined with temp_loss_weight -- see trainer.py's
  # _get_loss_fn docstring. Start at 1.0 (both normalized terms weighted
  # equally); retune once you've seen how the two loss curves behave.
  predict_temperature: true
  temp_loss_weight: 1.0
  optimizer:
    base_learning_rate: 0.0001
    min_learning_rate: 1.0e-07
    weight_decay: 0.01
  point_size: 2048
  scheduler:
    end_factor: 0.05
    lr_decay_rate: 0.001
    lr_decay_step: 1.0
    start_factor: 1.0
  use_gpu: true
  use_res: false
run:
  early_stop: true
  min_delta: 1.0e-06
  num_epochs: 150
  patience: 30
  run_folder: /local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/runs/forge_common_thermal_v1
  run_name: forge_common_thermal_v1
  save_every: 50
