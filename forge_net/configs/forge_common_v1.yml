# Train against forge_common.db (forge_common/data/forge_common.db) instead
# of the legacy `strike`/`forge_database.db` schema -- use with
# process_data_forge_common.make_dataset/make_dataloaders, NOT
# process_data.py's (see main.py's import line -- swap it to
# `from forge_net.data.process_data_forge_common import make_dataloaders, make_dataset`).
#
# Action space here is forge_common's own canonical Hit(rho, phi, z,
# duration) -- rho/z in mm, phi in RADIANS (raw; the press is double-sided
# so every phi value forge_common ever produces stays well within a single
# ~180deg span, no sin/cos wraparound handling needed -- see
# process_data_forge_common.py's module docstring). `duration` is left out
# of action_features below since every forge_common hit so far uses
# duration=1.0 (a constant carries no training signal); add it back if
# that ever varies.
databases:
  db_path: "/local/scratch/groves/forge_common/data/forge_common.db"
  source_sims: ["jax_forge", "agility_forge_data", "agility_forge_physforge", "cw_slab_model", "genesis"]
                     # pooling all 4 mesh-based sims' real_replay + cogging data, PLUS genesis, whose
                     # raw MPM particles (cell_type='point_cloud', no mesh connectivity) now have their
                     # own dispatch path in process_data_forge_common.py::process_series -- direct
                     # particle-index correspondence (MPM never creates/destroys/reorders particles
                     # mid-run), no barycentric sampling. See datasets.point_cloud_noise_std below.
  sequence_types: null # pooling both real_replay and cogging

datasets:
  total_points: 2048 # points sampled per mesh (volumetric tet sampling when a mesh has tetra, else surface-only)
  seed: 0
  data_out: "/local/scratch/groves/jax-forgeRL/models/forge-net/forge_net/data/datasets/forge_common_pooled_v1.npz"
  point_cloud_noise_std: 0.2 # mm -- Gaussian jitter (mean 0) for cell_type='point_cloud' pairs (genesis),
                             # applied per-epoch in the dataloader (same draw on both x_t/x_tp1, see
                             # dataloaders.py::SingleStepMeshTransitionDataset's docstring for why). Grounded
                             # in genesis's actual MPM particle spacing (Genesis/agforge/options.py: dx/2 with
                             # our real stock diameter=0.04m -> particle_size~=2.86mm) -- 0.2mm is ~5-10% of
                             # that spacing: enough to break exact grid-alignment, well below the spacing
                             # itself so real geometric signal isn't scrambled. Starting point, not yet
                             # empirically validated against training quality.

network:
  model_type: "forgenet"
  arch: "small" # still cheap/fast; revisit "large" once data volume grows well past ~1k pairs
  batch_size: 32 # 786 pairs (50 heuristic+random cw_slab_model runs, 2026-07-19) -- bump further as data grows
  latent_size: 128
  action_features: ["rho", "phi", "z"]
  action_dims: 3
  gradient_clip: 1.0
  use_res: False
  loss: "mse"
  optimizer:
    base_learning_rate: 1.0e-4
    min_learning_rate: 1.0e-7
    weight_decay: 1.0e-2
  scheduler:
    start_factor: 1.0
    end_factor: 0.05
    lr_decay_rate: 1.0e-3
    lr_decay_step: 1.0
  dropout: 0.1
  use_gpu: True

run:
  run_name: "forge_common_pooled_v1"
  save_every: 50
  run_folder: ???
  early_stop: False # trainer.py bug: self.early_stop doubles as both the config flag AND the
                    # "patience exceeded" trigger -- setting True here breaks the loop at epoch 0
                    # regardless of patience (every other config in this repo avoids it the same way)
  patience: 50
  min_delta: 1.0e-6
  num_epochs: 30 # pilot-scale smoke test of the pooled-source pipeline, not a converged model -- bump once
                 # data volume/source balance is revisited (see DEVELOPER_NOTES.md open follow-ups)

eval:
  eval_idxs: [0, 100, 300, 500, 700]
